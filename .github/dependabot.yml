# Dependabot version updates (monthly, max 2 open PRs per ecosystem) + security alerts.
# Security updates are separate and unaffected by this schedule/limit.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      npm-production:
        patterns:
          - "*"
        exclude-patterns:
          - "electron"
          - "electron-builder"
          - "@playwright/*"
          - "playwright"
          - "jsdom"
          - "sharp"
          - "nodemailer"
        update-types:
          - "minor"
          - "patch"
      npm-dev-tooling:
        patterns:
          - "electron"
          - "electron-builder"
          - "@playwright/*"
          - "playwright"
        update-types:
          - "patch"
    ignore:
      - dependency-name: "electron"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
