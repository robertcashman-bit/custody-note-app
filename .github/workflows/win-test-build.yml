# Unsigned Windows NSIS build for QA (no release publish).
# Trigger manually on a throwaway branch with package.json version e.g. 1.9.121-test.7

name: Windows test build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (branch or tag)'
        required: true
        default: 'cursor/attendance-type-dropdown-5764'

concurrency:
  group: win-test-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  win-test-build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build unsigned Windows NSIS installer
        run: npx electron-builder --win nsis --publish never

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: custody-note-win-test-${{ github.sha }}
          path: |
            dist/*.exe
            dist/latest.yml
          if-no-files-found: error
