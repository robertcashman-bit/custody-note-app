name: pdf-viewer-packaged

on:
  pull_request:
    paths:
      - 'lib/pdfViewer.js'
      - 'lib/automatedTestBuild.js'
      - 'pdf-viewer-*'
      - 'main/windowHardening.js'
      - 'tests/e2e/pdf-viewer*.ts'
      - '.github/workflows/pdf-viewer-packaged.yml'
      - 'package.json'
      - 'package-lock.json'

jobs:
  pdf-viewer-packaged:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install

      - name: Build unpacked Windows app
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          set -euo pipefail
          npx electron-builder --win --dir --publish never --config.extraMetadata.cnPackagedTestHooks=true
          EXE=""
          for f in dist/win-unpacked/*.exe; do
            if [[ "$(basename "$f")" == "Custody Note.exe" ]] || [[ "$(basename "$f")" == Custody*.exe ]]; then
              EXE="$f"
              break
            fi
          done
          if [[ -z "$EXE" ]]; then
            echo "::error::Custody Note.exe not found under dist/win-unpacked"
            ls -la dist/win-unpacked || true
            exit 1
          fi
          # Playwright on Windows merges argv into one shell command; paths with spaces
          # can prevent --remote-debugging-port from reaching Electron (launch timeout).
          E2E_EXE="dist/win-unpacked/CustodyNote-packaged-e2e.exe"
          cp "$EXE" "$E2E_EXE"
          echo "CUSTODYNOTE_PACKAGED_EXE=$E2E_EXE" >> "$GITHUB_ENV"
          echo "Built executable: $EXE (e2e copy: $E2E_EXE)"

      - name: Packaged PDF viewer e2e
        shell: bash
        env:
          CN_E2E_ARTIFACT_DIR: ${{ runner.temp }}/cn-pdf-artifacts
          CUSTODYNOTE_E2E_SKIP_LICENCE_GATE: '1'
          CUSTODYNOTE_PDF_VIEWER_STUB_PRINT: '1'
          CUSTODYNOTE_PDF_VIEWER_STUB_EMAIL: '1'
        run: npx playwright test tests/e2e/pdf-viewer-packaged.spec.ts

      - name: Upload PDF viewer captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-viewer-windows-packaged
          path: |
            ${{ runner.temp }}/cn-pdf-artifacts/viewer-render.png
            ${{ runner.temp }}/cn-pdf-artifacts/pdf-viewer-full-window.png
          if-no-files-found: warn
