# On push of a version tag (e.g. v1.4.24), build the Windows installer AND the
# signed + notarised macOS .dmg/.zip, publish both to GitHub Releases, then sync
# the marketing website to Vercel.
#
# Prerequisites (Settings > Secrets and variables > Actions):
# Required for Windows build (provided automatically):
# - GITHUB_TOKEN  — automatic, used to create the app release.
#
# Required for Windows Azure Artifact Signing when enabled (soft gate until Azure is ready):
# - AZURE_CLIENT_ID                 — Entra app registration Application (client) ID
# - AZURE_TENANT_ID                 — Entra directory (tenant) ID
# - AZURE_SUBSCRIPTION_ID           — Azure subscription ID (azure/login)
# - AZURE_CODE_SIGNING_ENDPOINT     — e.g. https://eus.codesigning.azure.net/
# - AZURE_CODE_SIGNING_ACCOUNT_NAME — Artifact Signing account name (YOUR_ACCOUNT)
# - AZURE_CERTIFICATE_PROFILE_NAME  — Certificate profile name (YOUR_CERT_PROFILE)
# - AZURE_TRUSTED_SIGNING_PUBLISHER_NAME — Cert CN, e.g. DEFENCELEGALSERVICES LIMITED
# Soft gate: if ALL of the above are absent → unsigned Windows build (warning logged).
# Fail-closed only when CN_WINDOWS_SIGN=1 OR secrets are partially present/misconfigured.
# Optional repo variable:
# - CN_WINDOWS_SIGN=1               — Require signing (fail if secrets incomplete)
# Full Azure setup checklist: SIGNING.md
#
# Microsoft Store (AppX/MSIX) package:
# - Built by job release-windows-msix (continue-on-error) so NSIS can still ship.
# - electron-builder target is "appx"; artefact name is Custody-Note-{version}.msix.
# - Uploaded UNSIGNED for Partner Center signing — see docs/MICROSOFT_STORE_RELEASE.md.
# - Required on the canonical draft before publish-release flips draft → live.
#
# Required for macOS Developer ID–signed + notarised build (fail-closed):
# - MAC_CERTIFICATE_P12_BASE64     — Base64-encoded Developer ID Application .p12 bundle.
# - MAC_CERTIFICATE_P12_PASSWORD   — Passphrase used when the .p12 was exported.
# - MAC_KEYCHAIN_PASSWORD          — Random passphrase for the temporary CI keychain.
# - APPLE_TEAM_ID                  — 10-character Apple Team ID (identity selection).
# - APPLE_ID                       — Apple Developer Program email.
# - APPLE_APP_SPECIFIC_PASSWORD    — App-specific password (xxxx-xxxx-xxxx-xxxx).
#
# Notarization is mandatory for GitHub Release Mac assets. If notarytool preflight
# fails (HTTP 401 / missing ASP), release-mac FAILS — it must NOT upload
# Developer ID–signed-but-unnotarized dmgs/zips. Do not set CN_SKIP_NOTARIZE in
# this workflow (that flag is a local/dev escape only).
#
# Optional (website deploy):
# - VERCEL_TOKEN  — Vercel dashboard > Settings > Tokens.
# - GH_PAT        — GitHub PAT with repo scope to clone the website repo.
#
# To run:
#   • Automatic: push version + changelog to main/master → "Auto-tag release if needed"
#     creates v{x.y.z} if missing → this workflow runs on that tag.
#   • Manual app build: Actions → this workflow → Run workflow (builds from selected branch).
#   • Manual tag: git tag v1.4.24 && git push origin v1.4.24

name: Release and deploy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─── Job 0: Single canonical draft release (prevents parallel draft races) ───
  prepare-release-draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout app
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Ensure one draft GitHub release for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ensure-github-release-draft.mjs

  # ─── Job 1a: Build the Windows installer and upload to GitHub Releases ──────
  # Upload-only: prepare-release-draft created the draft; we never let electron-builder
  # create a second release (parallel MSIX/Mac previously caused duplicate drafts).
  #
  # Windows code signing uses Azure Artifact Signing (OIDC via azure/login).
  # azureSignOptions are passed on the CLI only when signing is enabled so local
  # / unsigned builds do not force the Azure sign manager (see SIGNING.md).
  release-windows:
    needs: prepare-release-draft
    runs-on: windows-latest
    # Pins OIDC subject to environment:windows-signing so the Entra federated
    # credential can authorize tag builds (branch-scoped federation alone does
    # not match refs/tags/v*). Create the empty GitHub Environment once; see SIGNING.md.
    environment: windows-signing
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout app
        uses: actions/checkout@v4
        with:
          path: custody-note-app
          ref: ${{ github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: custody-note-app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: custody-note-app

      - name: Decide Windows Azure Artifact Signing
        id: win-sign
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_CODE_SIGNING_ENDPOINT: ${{ secrets.AZURE_CODE_SIGNING_ENDPOINT }}
          AZURE_CODE_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT_NAME }}
          AZURE_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
          AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
          CN_WINDOWS_SIGN: ${{ vars.CN_WINDOWS_SIGN }}
        run: |
          set -euo pipefail
          force_sign=false
          if [[ "${CN_WINDOWS_SIGN:-}" == "1" ]]; then
            force_sign=true
          fi

          required=(
            AZURE_CLIENT_ID
            AZURE_TENANT_ID
            AZURE_SUBSCRIPTION_ID
            AZURE_CODE_SIGNING_ENDPOINT
            AZURE_CODE_SIGNING_ACCOUNT_NAME
            AZURE_CERTIFICATE_PROFILE_NAME
            AZURE_TRUSTED_SIGNING_PUBLISHER_NAME
          )
          missing=()
          present=()
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            else
              present+=("$name")
            fi
          done

          if [[ ${#missing[@]} -eq 0 ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Azure Artifact Signing enabled for this Windows build (all secrets present)."
          elif [[ ${#present[@]} -gt 0 ]]; then
            echo "::error::Windows Azure Artifact Signing secrets are partially configured (present: ${present[*]}; missing: ${missing[*]}). Fix or remove the partial set before releasing. See SIGNING.md."
            exit 1
          elif [[ "$force_sign" == "true" ]]; then
            echo "::error::CN_WINDOWS_SIGN=1 requires Windows Azure Artifact Signing, but secrets are missing: ${missing[*]}. See SIGNING.md."
            exit 1
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Azure Artifact Signing secrets are not configured — building and publishing an UNSIGNED Windows installer. Complete SIGNING.md and set secrets (or CN_WINDOWS_SIGN=1 after secrets exist) when ready to require signed releases."
          fi

      - name: Azure login (OIDC)
        if: steps.win-sign.outputs.enabled == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build + upload Windows NSIS installer to GitHub
        working-directory: custody-note-app
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_CODE_SIGNING_ENDPOINT: ${{ secrets.AZURE_CODE_SIGNING_ENDPOINT }}
          AZURE_CODE_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT_NAME }}
          AZURE_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
          AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
          CN_WIN_SIGN_ENABLED: ${{ steps.win-sign.outputs.enabled }}
        run: |
          set -euo pipefail
          # NSIS only — AppX/MSIX is a separate job so a Store packaging failure
          # cannot block the GitHub Releases .exe channel.
          if [[ "${CN_WIN_SIGN_ENABLED}" == "true" ]]; then
            echo "Building signed Windows NSIS installer via Azure Artifact Signing…"
            npx electron-builder --win nsis --publish never \
              "-c.win.azureSignOptions.publisherName=${AZURE_TRUSTED_SIGNING_PUBLISHER_NAME}" \
              "-c.win.azureSignOptions.endpoint=${AZURE_CODE_SIGNING_ENDPOINT}" \
              "-c.win.azureSignOptions.codeSigningAccountName=${AZURE_CODE_SIGNING_ACCOUNT_NAME}" \
              "-c.win.azureSignOptions.certificateProfileName=${AZURE_CERTIFICATE_PROFILE_NAME}"
          else
            echo "Building unsigned Windows NSIS installer…"
            npx electron-builder --win nsis --publish never
          fi

      - name: Upload Windows NSIS assets to canonical draft release
        working-directory: custody-note-app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/upload-windows-release-assets.mjs

  # ─── Job 1a2: Build Microsoft Store AppX/MSIX (unsigned for Partner Center) ─
  # electron-builder 26.x Store target is "appx" (produces .msix via artifactName).
  # Partner Center signs for Store submission — we upload an unsigned package.
  # continue-on-error: NSIS release must still ship if only this job fails.
  release-windows-msix:
    needs: prepare-release-draft
    runs-on: windows-latest
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - name: Checkout app
        uses: actions/checkout@v4
        with:
          path: custody-note-app
          ref: ${{ github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: custody-note-app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: custody-note-app

      - name: Validate MSIX/AppX config + assets (fail this job only)
        working-directory: custody-note-app
        run: npm run validate:msix

      - name: Ensure AppX visual assets
        working-directory: custody-note-app
        run: npm run build:msix:assets

      - name: Build unsigned AppX/MSIX package
        id: msix-build
        working-directory: custody-note-app
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Building unsigned Microsoft Store package (appx → .msix). Partner Center will sign."
          npx electron-builder --win appx --publish never
          VERSION=$(node -p "require('./package.json').version")
          MSIX="dist/Custody-Note-${VERSION}.msix"
          APPX_FALLBACK=$(ls dist/*.appx 2>/dev/null | head -1 || true)
          if [[ -f "$MSIX" ]]; then
            echo "artifact=$MSIX" >> "$GITHUB_OUTPUT"
            echo "Found $MSIX"
          elif [[ -n "${APPX_FALLBACK}" && -f "${APPX_FALLBACK}" ]]; then
            echo "::warning::Expected .msix not found; uploading AppX artefact ${APPX_FALLBACK}"
            echo "artifact=${APPX_FALLBACK}" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No AppX/MSIX artefact produced under dist/"
            ls -la dist || true
            exit 1
          fi

      - name: Upload Store package to canonical draft release
        if: steps.msix-build.outputs.artifact != ''
        working-directory: custody-note-app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT: ${{ steps.msix-build.outputs.artifact }}
        run: |
          node scripts/ensure-github-release-draft.mjs --wait-only --max-attempts 60
          node scripts/upload-single-release-asset.mjs "$ARTIFACT"
          echo "Uploaded Store package (unsigned — Partner Center signs for Store)."

  # ─── Job 1b: Build the signed + notarised macOS .dmg/.zip and upload ────────
  # Imports the Developer ID Application certificate into a temporary keychain,
  # then runs the same scripts/build-mac-signed.mjs the developer uses locally.
  # The same package.json build.publish config drops the assets onto the matching
  # draft release created by prepare-release-draft (upload-only from build-mac-signed).
  release-mac:
    needs: prepare-release-draft
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout app
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Import Apple Developer ID certificate into a temporary keychain
        env:
          MAC_CERTIFICATE_P12_BASE64:   ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          MAC_CERTIFICATE_P12_PASSWORD: ${{ secrets.MAC_CERTIFICATE_P12_PASSWORD }}
          MAC_KEYCHAIN_PASSWORD:        ${{ secrets.MAC_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/cn-cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/cn-build.keychain-db"

          printf '%s' "$MAC_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERT_PATH"
          test -s "$CERT_PATH"

          security create-keychain -p "$MAC_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain      -p "$MAC_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MAC_CERTIFICATE_P12_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | xargs)
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$MAC_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          rm -f "$CERT_PATH"

      # Fail-closed: stale/missing APPLE_APP_SPECIFIC_PASSWORD must fail this job.
      # Never continue-on-error here — that previously enabled skip-notary publish and
      # shipped Unnotarized Developer ID dmgs (e.g. 1.9.79).
      - name: Preflight Apple notarization credentials
        id: notary-preflight
        env:
          APPLE_ID:                    ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID:               ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/preflight-apple-notary.mjs

      - name: Build, sign, notarise, Gatekeeper-assess, then upload macOS assets
        env:
          GH_TOKEN:                    ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID:                    ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID:               ${{ secrets.APPLE_TEAM_ID }}
          CN_PUBLISH:                  always
        run: |
          echo "Notarization preflight OK — building signed + notarised Mac assets (upload only after spctl passes)."
          npm run build:mac:signed

      - name: Regenerate latest-mac.yml from uploaded Mac assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          node scripts/repair-github-mac-updater-feed.mjs --tag "v${VERSION}"

  # ─── Job 2: Wait for all platform assets, then flip the release to live ─────
  # Runs after both platform builds. Polls the draft release for the full asset
  # set (Windows .exe + latest.yml, Mac .dmg/.zip for both arches + latest-mac.yml)
  # before flipping draft → published, so end-user auto-updaters never see a
  # half-finished release.
  publish-release:
    runs-on: ubuntu-latest
    needs: [release-windows, release-mac, release-windows-msix]
    permissions:
      contents: write
    steps:
      - name: Checkout app
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Wait for all assets on canonical release, verify, publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/wait-and-publish-release.mjs

  # ─── Job 3: Sync website changelog and deploy to Vercel ─────────────────────
  # Optional — continue-on-error means a missing GH_PAT/VERCEL_TOKEN won't fail
  # the overall workflow.
  deploy-website:
    runs-on: ubuntu-latest
    needs: publish-release
    continue-on-error: true
    steps:
      - name: Checkout app
        uses: actions/checkout@v4
        with:
          path: custody-note-app
          ref: ${{ github.ref }}

      - name: Checkout website
        uses: actions/checkout@v4
        with:
          repository: robertcashman-bit/custody-note-website
          path: custody-note-website
          token: ${{ secrets.GH_PAT }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: custody-note-app/package-lock.json

      - name: Install app dependencies
        run: npm ci
        working-directory: custody-note-app

      - name: Configure git for website commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync website releases.json and push
        working-directory: custody-note-app
        env:
          WEBSITE_ROOT: ${{ github.workspace }}/custody-note-website
        run: node scripts/sync-website.mjs

      - name: Bump download page version + soften Mac notarization copy
        working-directory: custody-note-app
        env:
          WEBSITE_ROOT: ${{ github.workspace }}/custody-note-website
        run: |
          set -euo pipefail
          node scripts/bump-website-download-version.mjs
          cd "$WEBSITE_ROOT"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            VERSION=$(node -p "require('${{ github.workspace }}/custody-note-app/package.json').version")
            git commit -m "Download: bump to v${VERSION} (Developer ID signed Mac; notarization pending)"
            BRANCH=$(git rev-parse --abbrev-ref HEAD)
            git pull --rebase origin "$BRANCH" || true
            git push origin "HEAD:${BRANCH}"
            echo "Pushed download-page bump to website ${BRANCH}."
          else
            echo "Website download page already matched app version / copy."
          fi
