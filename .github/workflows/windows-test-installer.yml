# Manual Windows NSIS test builds (pre-release / draft only — never mirrors to custody-note-releases).
#
# Actions → "Windows test installer" → Run workflow → set version (e.g. 1.9.123-test.1) and branch ref.
name: Windows test installer

on:
  push:
    branches:
      - cursor/times-travel-pdf-summary-6424
  workflow_dispatch:
    inputs:
      version:
        description: 'Installer version (e.g. 1.9.123-test.1)'
        required: true
        type: string
        default: '1.9.123-test.2'

concurrency:
  group: windows-test-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Resolve test version
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=1.9.123-test.2" >> "$GITHUB_OUTPUT"
          fi

      - name: Build unsigned Windows NSIS (test version)
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CN_TEST_VERSION: ${{ steps.ver.outputs.value }}
        run: |
          set -euo pipefail
          npx electron-builder --win nsis --publish never \
            "--config.extraMetadata.version=${CN_TEST_VERSION}"
          EXE="dist/Custody-Note-Setup-${CN_TEST_VERSION}.exe"
          if [[ ! -f "$EXE" ]]; then
            echo "::error::Expected $EXE"
            ls -la dist || true
            exit 1
          fi
          sha256sum "$EXE" | tee "dist/Custody-Note-Setup-${CN_TEST_VERSION}.sha256.txt"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Custody-Note-Setup-${{ steps.ver.outputs.value }}
          path: |
            dist/Custody-Note-Setup-${{ steps.ver.outputs.value }}.exe
            dist/Custody-Note-Setup-${{ steps.ver.outputs.value }}.sha256.txt

      - name: Create draft pre-release on app repo (not public feed)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${{ steps.ver.outputs.value }}"
          EXE="dist/Custody-Note-Setup-${{ steps.ver.outputs.value }}.exe"
          if gh release view "$TAG" --repo "${{ github.repository }}" 2>/dev/null; then
            gh release upload "$TAG" "$EXE" --repo "${{ github.repository }}" --clobber
          else
            gh release create "$TAG" "$EXE" \
              --repo "${{ github.repository }}" \
              --title "Test build ${{ steps.ver.outputs.value }}" \
              --notes "Pre-release test installer. Not published to custody-note-releases and not offered as Latest." \
              --draft \
              --prerelease
          fi
