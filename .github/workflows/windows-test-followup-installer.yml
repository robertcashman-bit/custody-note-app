# Private Windows test installer for feature branches (does NOT update latest.yml or ship to production).
# Produces: Custody-Note-Setup-{version}-test-followup.exe as a workflow artifact and optional prerelease.
#
# Auto-update: this workflow does not run release-publish or upload latest.yml to a non-prerelease
# "latest" release, so existing users are not offered this build.
name: Windows test installer (follow-up)

on:
  push:
    branches:
      - 'cursor/follow-up-attendance-7371'
  workflow_dispatch:
    inputs:
      label_suffix:
        description: 'Installer filename suffix (default test-followup2)'
        required: false
        default: 'test-followup2'
      create_prerelease:
        description: 'Also attach to a GitHub prerelease (tag test-win-*; not v*)'
        type: boolean
        required: false
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test:unit

      - name: Build Windows NSIS (test artifact name)
        shell: bash
        env:
          LABEL_SUFFIX: ${{ inputs.label_suffix || 'test-followup2' }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          npx electron-builder --win nsis --publish never \
            -c.nsis.artifactName="Custody-Note-Setup-${VERSION}-${LABEL_SUFFIX}.\${ext}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: custody-note-setup-test-followup2
          path: dist/Custody-Note-Setup-*-test-followup2.exe
          if-no-files-found: error

      - name: Create GitHub prerelease (optional)
        if: github.event_name == 'push' || inputs.create_prerelease != false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LABEL_SUFFIX: ${{ inputs.label_suffix || 'test-followup2' }}
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="test-win-${VERSION}-${LABEL_SUFFIX}-${GITHUB_RUN_ID}"
          FILE="dist/Custody-Note-Setup-${VERSION}-${LABEL_SUFFIX}.exe"
          gh release create "$TAG" "$FILE" \
            --title "Test build ${VERSION} (${LABEL_SUFFIX})" \
            --notes "Private test installer — not for production auto-update." \
            --prerelease
