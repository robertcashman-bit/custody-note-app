name: Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install

      - name: Unit tests
        run: npm run test:unit

      - name: Validate MSIX/AppX packaging config
        run: npm run validate:msix

      - name: Data-safety gate
        run: npm run test:data-safety

      - name: Security audit (production deps + secrets)
        run: npm run security:audit

      - name: Playwright e2e
        run: npm run test:e2e

      # The legacy in-app smoke test (`npm test`) launches Electron with
      # ELECTRON_RUN_AS_TEST=1 and runs a scripted renderer-side journey.
      # It is flaky on the GitHub Actions windows-latest runner because
      # the VM is GPU-less and the renderer needs multiple seconds to
      # transition past the splash before assertions fire. The Playwright
      # e2e suite above (tests/e2e/stress-journey.spec.ts) already launches
      # Electron and exercises the same end-to-end flows (29+ steps) with
      # deterministic waits, so we rely on it as the CI gate. The smoke
      # test is still run locally as part of `npm run test:all` before
      # every release.

      # macOS unit tests were removed from this workflow — they duplicated
      # Windows `test:unit` and burned expensive macos-latest minutes.
      # Signed Mac builds still run on macos-latest in release-publish.yml.

  # Proves electron-builder can produce the Store package on Windows.
  # Does not sideload/install (no interactive Store identity on GHA).
  msix-package:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate MSIX/AppX config + assets
        run: npm run validate:msix

      - name: Ensure AppX visual assets
        run: npm run build:msix:assets

      - name: Build unsigned AppX/MSIX (Windows Kits required)
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          set -euo pipefail
          npx electron-builder --win appx --publish never
          VERSION=$(node -p "require('./package.json').version")
          MSIX="dist/Custody-Note-${VERSION}.msix"
          if [[ ! -f "$MSIX" ]]; then
            echo "::error::Expected $MSIX missing after appx build"
            ls -la dist || true
            exit 1
          fi
          echo "Built $MSIX ($(wc -c < "$MSIX") bytes)"
          echo "MSIX_PATH=$MSIX" >> "$GITHUB_ENV"

      - name: Upload MSIX artefact
        uses: actions/upload-artifact@v4
        with:
          name: custody-note-msix
          path: dist/Custody-Note-*.msix
          if-no-files-found: error
