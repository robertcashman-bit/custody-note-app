<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>New record chooser</title>
  <link rel="stylesheet" href="../../styles.css" />
</head>
<body style="margin:0;background:#1e293b;min-height:100vh;display:flex;align-items:center;justify-content:center;">
  <div id="new-record-type-overlay" class="cn-confirm-overlay" style="display:flex;position:relative;background:rgba(0,0,0,0.45);" role="dialog">
    <div class="cn-confirm-box" style="max-width:420px;">
      <h3 class="cn-confirm-title">Start a new record</h3>
      <p class="cn-confirm-msg" style="margin-bottom:0.75rem;">Choose the type of attendance or capture.</p>
      <div class="cn-confirm-btns" style="flex-direction:column;gap:0.5rem;align-items:stretch;">
        <button type="button" class="btn btn-primary">Custody attendance</button>
        <button type="button" class="btn btn-secondary">Follow-up attendance (existing client)</button>
        <button type="button" class="btn btn-secondary">Voluntary attendance</button>
        <button type="button" class="btn btn-secondary">Telephone advice (INVB)</button>
        <button type="button" class="btn btn-secondary">Quick Capture</button>
      </div>
    </div>
  </div>
</body>
</html>
